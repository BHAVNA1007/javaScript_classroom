<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>when one promise rejected</h1>


    <script>

        let p1 = Promise.resolve("task 1 completed")
        let p2 = Promise.reject("task 2 faild")
        let p3 = Promise.resolve("task 3 completed")

        Promise.all([p1, p2, p3])
        .then((result)=>{
            console.log(result)
        })
        .catch((error)=>{
            console.log(error)
        })
       
    </script>
    
</body>
</html>
