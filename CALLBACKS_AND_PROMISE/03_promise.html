<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2> helloooooo </h2>

    <script>

        console.log("code started")
        let a = 10
        let b = 0
        let waitingdata = new Promise((resolve, reject) => {

            setTimeout(() => {
                resolve(20)
            }, 3000)
        })

        waitingdata.then((data)=>{
            b = data
            console.log(a+b)
        })

        console.log("code completed")
    </script>
    
</body>
