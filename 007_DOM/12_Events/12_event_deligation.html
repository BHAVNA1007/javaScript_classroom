    <!-- But imagine you have 100 buttons. You are attaching 100 event listeners.
     Can we handle all these buttons using just one event listener?
     Yes! That's where event delegation comes in. -->


     <!-- 3. Solve the same problem using event delegation
      Instead of attaching listeners to three buttons, attach only one listener to their parent.
     -->


     <script>
        document.getElementById("parent").addEventListener("click", function(event){
            console.log(event.target.innerText)
        })
     </script>


     <!-- The important point:
     - event.target tells us that Mango was clicked.
     - The parent receives the event because of bubbling.
     - The parent listener handles the event.
     This combination of event bubbling + parent event listener + identifying the clicked child is event delegation.
      -->
</body>
