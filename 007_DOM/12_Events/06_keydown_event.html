<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" id="message" placeholder="Type any message">
    <button id="send">Enter</button>
    <p id="output"></p>

    <script>

        let msg = document.getElementById("message")

        function sendmessage(){

            if (msg.value.trim() !== ""){

                document.getElementById("output").textContent = "sent  " + msg.value;
                msg.value = ""
            }
        }


        document.getElementById("send").addEventListener("click", sendmessage)

        msg.addEventListener("keydown", function(event){

            if(event.key === "Enter"){

                sendmessage
            }
        })
    </script>
    
</body>
</html>
