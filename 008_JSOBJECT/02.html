<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding properties dynamically</title>
</head>
<body>
    

        <script>

        let obj ={

            name: "deepika",
            address: "chennai",

            display:function(){

                console.log("display function")
                console.log("name inside display : ", this.name)
                console.log("address inside display", this.address)


            }
        }

        console.log(obj)
        console.log(obj.name)
        obj.display()



        obj['email'] = "dipu@gmail.com"
        console.log(obj)


        delete obj['address']
        console.log(obj)


        for (let x in obj){

            console.log(x, obj[x])
        }
    </script>
    
</body>
</html>
